<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Profile</title>
  <meta name="description" content="Your profile and order history." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="Your profile and order history." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/pages/profile.html" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/pages/profile.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/profile.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="../index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <div id="header" data-component="header"></div>

  <main id="main" class="profile">
    <div class="profile__head" data-profile-head data-reveal></div>

    <!-- Figma (yangilangan): bu bo'lim TELEFON versiyasida ko'rinmaydi.
         Yashirish CSS'da (css/pages/profile.css), shu data-atribut orqali. -->
    <section class="profile__orders" data-orders-section data-reveal>
      <h2 class="profile__orders-title" data-split>My orders</h2>
      <div class="product-grid" data-orders></div>
    </section>

    <!-- API has no wishlist endpoint -> saved locally (localStorage) -->
    <section class="profile__orders" data-reveal>
      <h2 class="profile__orders-title" data-split>Favorites</h2>
      <p class="profile__note">Saved on this device only. Favorites are not linked to your account.</p>
      <div class="product-grid" data-favorites></div>
    </section>

    <!-- Google Translate: avtomatik, jahon tillariga. Faqat shu sahifada
         ko'rinadi; googtrans cookie orqali boshqa sahifalarda ham ishlaydi
         (har sahifada js/translate.js yuklangan). -->
    <section class="profile__lang" data-reveal>
      <h2 class="profile__lang-title" data-split>Language</h2>
      <div id="google_translate_element"></div>
    </section>
  </main>

  <div id="footer" data-component="footer"></div>

  <script src="../js/translate.js" defer></script>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
