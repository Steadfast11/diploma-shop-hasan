<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Log In</title>
  <meta name="description" content="Log in to your account." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="Log in to your account." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/pages/login.html" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/pages/login.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, follow" />

  <!-- API — отсюда приходят все данные. Устанавливаем соединение заранее
       (DNS + TLS), чтобы первый запрос прошёл быстрее. -->
  <link rel="preconnect" href="https://api.wepro.uz" crossorigin />

  <!-- Шрифт Inter ВНУТРИ ПРОЕКТА (css/base/fonts.css). Текст на странице
       латиница, поэтому браузер загружает только блок "latin". -->
  <link rel="preload" as="font" type="font/woff2"
        href="/assets/fonts/inter-latin.woff2" crossorigin />
  <link rel="stylesheet" href="../css/base/fonts.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="../index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <div id="header" data-component="header"></div>

  <main id="main" class="auth" data-reveal>
    <h1 class="auth-title" data-split>Log In</h1>

    <p class="auth-notice">This is an educational sandbox. Do not use a real password.</p>

    <!-- Для преподавателя: вход по EMAIL (так требует API), а не по "Phone", как в макете -->
    <form class="auth-form" data-login-form novalidate>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" id="email" name="email" type="email"
               placeholder="email@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" id="password" name="password" type="password"
               placeholder="Your password" autocomplete="current-password" required />
      </div>

      <p class="auth-error" data-error role="alert" hidden></p>
      <button class="auth-submit" type="submit">Log In</button>
    </form>

    <p class="auth-alt">
      Don't have an account? <a href="/pages/register.html">Register</a>
    </p>
  </main>


  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
