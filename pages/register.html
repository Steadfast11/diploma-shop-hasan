<head>
  <meta charset="UTF-8" />

  <title>Diploma Shop — Register</title>
  <meta name="description" content="Create a new account." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="Create a new account." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/pages/register.html" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/pages/register.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="../index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <div id="header" data-component="header"></div>

  <main id="main" class="auth" data-reveal>
    <h1 class="auth__title">Register</h1>

    <form class="auth__form" data-register-form novalidate>
      <div class="field">
        <label class="field__label" for="name">Name</label>
        <input class="field__input" id="name" name="name" type="text" placeholder="Alex" required />
      </div>
      <div class="field">
        <label class="field__label" for="surname">Surname</label>
        <input class="field__input" id="surname" name="surname" type="text" placeholder="Adams" required />
      </div>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="field__input" id="email" name="email" type="email" placeholder="email@example.com" required />
      </div>
      <div class="field">
        <label class="field__label" for="phone">Phone</label>
        <input class="field__input" id="phone" name="phone" type="tel" placeholder="+998" required />
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="field__input" id="password" name="password" type="password" placeholder="Your password" required />
      </div>
      <div class="field">
        <label class="field__label" for="password2">Repeat your password</label>
        <input class="field__input" id="password2" name="password2" type="password" placeholder="Your password" required />
      </div>

      <p class="auth__error" data-error hidden></p>
      <button class="auth__submit" type="submit">Create an account</button>
    </form>

    <p class="auth__alt">
      Already have an account? <a href="/pages/login.html">Log in</a>
    </p>
  </main>

  <div id="footer" data-component="footer"></div>

  <!-- Google Translate: har sahifada (yashirin) -> cookie orqali boshqa sahifa ham tarjima qilinadi. Ko'rinadigani faqat profile.html da. -->
  <div id="google_translate_element" hidden></div>
  <script src="../js/translate.js" defer></script>

  <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
