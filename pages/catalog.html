<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Catalog</title>
  <meta name="description" content="All products — filter by category and price." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="All products — filter by category and price." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/pages/catalog.html" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/pages/catalog.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow" />

  <!-- API — отсюда приходят все данные. Устанавливаем соединение заранее
       (DNS + TLS), чтобы первый запрос прошёл быстрее. -->
  <link rel="preconnect" href="https://api.wepro.uz" crossorigin />

  <!-- Шрифт Inter ВНУТРИ ПРОЕКТА (css/base/fonts.css). Текст на странице
       латиница, поэтому браузер загружает только блок "latin". -->
  <link rel="preload" as="font" type="font/woff2"
        href="/assets/fonts/inter-latin.woff2" crossorigin />
  <link rel="stylesheet" href="../css/base/fonts.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/catalog.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="../index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <div id="header" data-component="header"></div>

  <main id="main" class="catalog">
    <!-- Затемняет фон при открытом мобильном фильтре; клик закрывает его. -->
    <button class="filter-backdrop" type="button" data-filter-close
            aria-label="Close filters" tabindex="-1"></button>

    <!-- СЛЕВА: панель фильтра. Figma: шрифт SF Pro, светлая рамка 1px, radius 20.
         .filter-col — "колонка" панели: она растягивается на высоту страницы,
         а сама панель внутри неё sticky и движется вместе со скроллом. -->
    <div class="filter-col">
      <aside class="filter" id="catalog-filters">
        <div class="filter-head">
          <p class="filter-title">Filters</p>
          <!-- На мобильном sheet эта иконка — кнопка закрытия (на десктопе просто иконка). -->
          <button class="filter-close" type="button" data-filter-close
                  aria-label="Close filters">
            <img src="/assets/icons/filter.svg" alt="" width="24" height="24" />
          </button>
        </div>

        <div class="filter-divider"></div>

        <!-- Категории — выбор кликом по одной (в API category=<id>) -->
        <div class="filter-group" data-category-list>
          <button class="filter-row" type="button" data-category="1">
            <span>Categorie 1</span>
            <img class="filter-chevron" src="/assets/icons/chevron.svg" alt="" width="16" height="16" />
          </button>
          <button class="filter-row" type="button" data-category="2">
            <span>Categorie 2</span>
            <img class="filter-chevron" src="/assets/icons/chevron.svg" alt="" width="16" height="16" />
          </button>
          <button class="filter-row" type="button" data-category="3">
            <span>Categorie 3</span>
            <img class="filter-chevron" src="/assets/icons/chevron.svg" alt="" width="16" height="16" />
          </button>
        </div>

        <div class="filter-divider"></div>

        <!-- Диапазон цены — открывается/закрывается кликом по заголовку -->
        <div class="filter-group">
          <button class="filter-row filter-row-static" type="button"
                  data-price-toggle aria-expanded="true" aria-controls="price-panel">
            <span class="filter-subtitle">Price</span>
            <img class="filter-chevron" src="/assets/icons/chevron.svg" alt="" width="16" height="16" />
          </button>
          <div class="price" id="price-panel" data-price-panel>
            <input class="price-input price-input-min" type="range" min="0" max="100" value="0" aria-label="Minimum price" />
            <input class="price-input price-input-max" type="range" min="0" max="100" value="100" aria-label="Maximum price" />
            <div class="price-track"><div class="price-fill"></div></div>
            <div class="price-labels">
              <span data-price-min>$0</span>
              <span data-price-max>$100</span>
            </div>
          </div>
        </div>

        <div class="filter-divider"></div>

        <button class="filter-apply" type="button" data-apply-filter>Apply Filter</button>
        <button class="filter-clear" type="button" data-clear-filter hidden>Clear filters</button>
      </aside>
    </div>

    <!-- СПРАВА: заголовок + сетка товаров -->
    <div class="catalog-content">
      <div class="catalog-head" data-reveal>
        <h1 class="catalog-title" data-split>All products</h1>
        <!-- Figma мобильная версия: панель фильтра открывается модально через эту иконку. -->
        <button class="catalog-filter-toggle" type="button" data-filter-open
                aria-controls="catalog-filters" aria-expanded="false"
                aria-label="Open filters">
          <img src="/assets/icons/filter.svg" alt="" width="18" height="18" />
        </button>
        <!-- Поиск: в API нет поиска на стороне сервера -> фильтрует уже
             загруженный список по названию локально (client-side). -->
        <input class="catalog-search" type="search" placeholder="Search loaded products…"
               aria-label="Search currently loaded products" data-search />
      </div>
      <!-- карточки отрисовывает js/pages/catalog.js из API -->
      <div class="product-grid" data-products data-reveal-stagger></div>
      <button class="catalog-more" type="button" data-load-more hidden>Load more</button>
    </div>
  </main>

  <div id="footer" data-component="footer"></div>

  <script type="module" src="../js/pages/catalog.js"></script>
</body>
</html>
