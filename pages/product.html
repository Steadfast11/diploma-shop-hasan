<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Product</title>
  <meta name="description" content="Product details, price and customer reviews." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="Product details, price and customer reviews." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/pages/product.html" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/pages/product.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="/components/modal.css" />
  <link rel="stylesheet" href="../css/pages/product.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="../index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <div id="header" data-component="header"></div>

  <main id="main" class="container product">
    <div class="product__top" data-reveal>
      <div class="product__gallery" data-gallery></div>
      <div class="product__info" data-info></div>
    </div>

    <section class="reviews" data-reveal>
      <div class="reviews__head">
        <h2 class="reviews__title">All Reviews <span class="reviews__count" data-review-count></span></h2>
        <button class="reviews__write" type="button" data-write-review>Write a Review</button>
      </div>
      <div class="reviews__grid" data-reviews></div>
    </section>
  </main>

  <div id="footer" data-component="footer"></div>

  <script type="module" src="../js/pages/product.js"></script>
</body>
</html>
