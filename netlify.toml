# Statik sayt — hech qanday build bosqichi yo'q.
# Netlify repo ildizini to'g'ridan-to'g'ri tarqatadi.
[build]
  publish = "."

# .html kengaytmasi saqlansin (bizning ichki havolalar /pages/x.html)
[build.processing]
  skip_processing = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Barcha sahifalar uchun asosiy brauzer xavfsizlik qoidalari.
# Google Translate olib tashlangach CSP ancha qattiqlashdi:
#   - script-src: faqat 'self' (endi 'unsafe-inline' ham kerak emas —
#     barcha skriptlar alohida fayllarda)
#   - frame-src: 'none' (hech qanday iframe yuklanmaydi)
#   - tashqi manbalardan faqat Google Fonts (Inter shrifti) qoldi
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.wepro.uz; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
