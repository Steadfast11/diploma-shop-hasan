# Statik sayt — hech qanday build bosqichi yo'q.
# Netlify repo ildizini to'g'ridan-to'g'ri tarqatadi.
[build]
  publish = "."

# .html kengaytmasi saqlansin (bizning ichki havolalar /pages/x.html)
[build.processing]
  skip_processing = false

# /assets/* — rasm, ikonka VA shriftlar (/assets/fonts/*) shu qoidaga tushadi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Barcha sahifalar uchun asosiy brauzer xavfsizlik qoidalari.
# Google Translate olib tashlangach va shrift o'zimizga ko'chgach, CSP
# deyarli to'liq yopildi — sayt HECH QANDAY tashqi manbaga bog'liq emas:
#   - script-src: faqat 'self' ('unsafe-inline' kerak emas — barcha
#     skriptlar alohida fayllarda)
#   - style-src: 'unsafe-inline' faqat GSAP element.style yozgani uchun
#   - font-src / img-src: o'zimizniki (img-src'da https: — mahsulot
#     rasmlari API'da tashqi manzillarda turadi)
#   - connect-src: faqat bizning API; frame-src: 'none'
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.wepro.uz; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
