<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Home</title>
  <meta name="description" content="WEPRO — an online store for natural skincare products. Shop creams, serums, lotions and more." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="WEPRO — an online store for natural skincare products. Shop creams, serums, lotions and more." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://wepro-diploma.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://wepro-diploma.netlify.app/" />
  <meta property="og:url" content="https://wepro-diploma.netlify.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow" />

  <!-- Structured data (JSON-LD) — statik HTML'da, JS kerak emas (qidiruv
       tizimlari kod ishlatmasdan ham o'qiy oladi). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineStore",
    "name": "WEPRO",
    "url": "https://wepro-diploma.netlify.app/",
    "logo": "https://wepro-diploma.netlify.app/assets/icons/logo.png",
    "sameAs": ["https://instagram.com", "https://facebook.com", "https://youtube.com"]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "WEPRO",
    "url": "https://wepro-diploma.netlify.app/"
  }
  </script>

  <!-- Inter shrifti — yagona tashqi manba (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

  <!-- Umumiy stillar. Har sahifada AYNAN shu tartibda ulanadi:
       reset -> variables -> base -> ui -> (shu sahifaning stili) -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="css/pages/home.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <!-- Header shu bo'sh div ichiga js/components.js orqali qo'yiladi -->
  <div id="header" data-component="header"></div>

  <main>
    <!-- HERO — butun kenglik (shuning uchun .container'dan tashqarida) -->
    <section class="hero">
      <div class="hero__bg" aria-hidden="true">
        <img src="/assets/images/hero.jpg" alt="" data-parallax />
      </div>
      <div class="hero__inner container">
        <div class="hero__offer">
          <div class="hero__text">
            <p class="hero__eyebrow" data-hero-line>Discover Nature’s Finest Ingredients</p>
            <h1 class="hero__title" data-hero-line>Glow with nature’s finest, every single day</h1>
          </div>
          <a href="/pages/catalog.html" class="btn-glass hero__btn">Shop now</a>
        </div>
      </div>
    </section>

    <!-- Seksiyalar — 1200px konteyner ichida -->
    <div class="container home-sections">
      <section class="section" data-reveal>
        <h2 class="section__title">Best sellers</h2>
        <!-- kartochkalarni js/pages/home.js API'dan chizadi -->
        <div class="product-grid" data-bestsellers data-reveal-stagger></div>
      </section>

      <section class="section" data-reveal>
        <h2 class="section__title">Shop by category</h2>
        <div class="category-grid" data-categories data-reveal-stagger></div>
      </section>

      <section class="section" data-reveal>
        <h2 class="section__title">Featured products</h2>
        <div class="product-grid" data-featured data-reveal-stagger></div>
      </section>
    </div>
  </main>

  <!-- Footer ham js/components.js orqali qo'yiladi -->
  <div id="footer" data-component="footer"></div>

  <!-- Google Translate: har sahifada (yashirin) -> cookie orqali boshqa sahifa ham tarjima qilinadi. Ko'rinadigani faqat profile.html da. -->
  <div id="google_translate_element" hidden></div>
  <script src="js/translate.js" defer></script>

  <!-- type="module": fayllar bir-birini import/export qila oladi -->
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
