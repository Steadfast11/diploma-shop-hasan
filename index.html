<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon.svg" />
  <title>Diploma Shop — Home</title>
  <meta name="description" content="WEPRO — an online store for natural skincare products. Shop creams, serums, lotions and more." />
  <meta property="og:title" content="WEPRO — Online Store" />
  <meta property="og:description" content="WEPRO — an online store for natural skincare products. Shop creams, serums, lotions and more." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://diploma-shop-z84469105.netlify.app/assets/images/hero.jpg" />
  <link rel="canonical" href="https://diploma-shop-z84469105.netlify.app/" />
  <meta property="og:url" content="https://diploma-shop-z84469105.netlify.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow" />

  <!-- Структурированные данные (JSON-LD) — в статичном HTML, JS не нужен
       (поисковые системы могут прочитать и без выполнения кода). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineStore",
    "name": "WEPRO",
    "url": "https://diploma-shop-z84469105.netlify.app/",
    "logo": "https://diploma-shop-z84469105.netlify.app/assets/icons/logo.png",
    "sameAs": ["https://instagram.com", "https://facebook.com", "https://youtube.com"]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "WEPRO",
    "url": "https://diploma-shop-z84469105.netlify.app/"
  }
  </script>

  <!-- Изображение hero — самый крупный элемент на странице (Google называет это "LCP").
       Начинаем загружать заранее (ещё до CSS) -> сайт открывается быстрее. -->
  <link rel="preload" as="image" href="/assets/images/hero.webp" fetchpriority="high" />

  <!-- API — отсюда приходят все данные. Устанавливаем соединение заранее
       (DNS + TLS), чтобы первый запрос прошёл быстрее. -->
  <link rel="preconnect" href="https://api.wepro.uz" crossorigin />

  <!-- Шрифт Inter ВНУТРИ ПРОЕКТА (css/base/fonts.css). Текст на странице
       латиница, поэтому браузер загружает только блок "latin". -->
  <link rel="preload" as="font" type="font/woff2"
        href="/assets/fonts/inter-latin.woff2" crossorigin />
  <link rel="stylesheet" href="css/base/fonts.css" />
  <!-- Общие стили. На каждой странице подключаются В ТОЧНО ТАКОМ порядке:
       reset -> variables -> base -> ui -> (стиль этой страницы) -->
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/base/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <link rel="stylesheet" href="css/pages/home.css" />
  <script defer src="/js/vendor/gsap.min.js"></script>
  <script defer src="/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/js/vendor/lenis.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div style="padding:24px;font-family:sans-serif;">
      <p><strong>WEPRO</strong> needs JavaScript enabled to load the shop (products, cart and account come from a live API). Please enable JavaScript, or visit <a href="index.html">the homepage</a>.</p>
    </div>
  </noscript>
  <!-- Header вставляется в этот пустой div через js/components.js -->
  <div id="header" data-component="header"></div>

  <main id="main">
    <!-- HERO — на всю ширину (поэтому вне .container) -->
    <section class="hero">
      <div class="hero-bg" aria-hidden="true">
        <!-- webp на 79% легче (205 КБ -> 43 КБ). <picture>: старый браузер,
             не поддерживающий webp, получит jpg. -->
        <picture>
          <source srcset="/assets/images/hero.webp" type="image/webp" />
          <img src="/assets/images/hero.jpg" alt="" width="1920" height="1207"
               fetchpriority="high" decoding="async" data-parallax />
        </picture>
      </div>
      <div class="hero-inner container">
        <div class="hero-offer">
          <div class="hero-text">
            <p class="hero-eyebrow" data-hero-line>Discover Nature’s Finest Ingredients</p>
            <h1 class="hero-title" data-hero-line>Glow with nature’s finest, every single day</h1>
          </div>
          <a href="/pages/catalog.html" class="btn-glass hero-btn">Shop now</a>
        </div>
      </div>
    </section>

    <!-- Секции — внутри контейнера 1200px -->
    <div class="container home-sections">
      <section class="section" data-reveal>
        <h2 class="section-title" data-split>Best sellers</h2>
        <!-- карточки отрисовывает js/pages/home.js из API -->
        <div class="product-grid" data-bestsellers data-reveal-stagger></div>
      </section>

      <section class="section" data-reveal>
        <h2 class="section-title" data-split>Shop by category</h2>
        <div class="category-grid" data-categories data-reveal-stagger></div>
      </section>

      <section class="section" data-reveal>
        <h2 class="section-title" data-split>Featured products</h2>
        <div class="product-grid" data-featured data-reveal-stagger></div>
      </section>
    </div>
  </main>

  <!-- Footer тоже вставляется через js/components.js -->
  <div id="footer" data-component="footer"></div>

  <!-- type="module": файлы могут делать import/export друг у друга -->
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
